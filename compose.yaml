name: mix-agent

x-restricted: &restricted
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  tmpfs:
    - /tmp:size=256m,mode=1777

services:
  init:
    image: python:3.12.11-slim-bookworm
    entrypoint: [python, /bootstrap.py]
    network_mode: none
    volumes:
      - ./deploy/docker/bootstrap.py:/bootstrap.py:ro
      - keys:/keys
      - db-secret:/db-secret
      - execution-token:/execution-token
      - mcp-token:/mcp-token
      - manager-token:/manager-token
      - browser-token:/browser-token
      - browser-provisioner-token:/browser-provisioner-token
      - browser-data:/browser-data
      - data:/data
      - policy:/policy
      - workspace:/workspace
      - packages:/packages
      - mcp-shared:/shared
  db:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: mix
      POSTGRES_USER: mix
      POSTGRES_PASSWORD_FILE: /db-secret/password
    volumes: ["postgres:/var/lib/postgresql/data", "db-secret:/db-secret:ro"]
    networks: [database]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mix -d mix"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    <<: *restricted
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: app}
    ports: ["${MIX_BIND:-127.0.0.1}:8080:8080"]
    environment:
      DB_PASSWORD_FILE: /db-secret/password
      MIX_DATA: /data
      MIX_KEYS: /keys
      RUNNER_KEYS: /runner-keys
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      # `text` (default) or `json`; see docs/operations.md.
      MIX_LOG_FORMAT: "${MIX_LOG_FORMAT:-text}"
      # Optional: require `Authorization: Bearer <token>` on /metrics. When
      # unset, /metrics only answers loopback/private-network clients; set
      # MIX_METRICS_PUBLIC=1 to publish it to any client.
      METRICS_TOKEN: "${METRICS_TOKEN:-}"
      MIX_METRICS_PUBLIC: "${MIX_METRICS_PUBLIC:-}"
      # Read-only view of one host folder, used for AGENTS.md / CLAUDE.md and
      # for skills discovered under .mix/skills (then .claude/skills, then
      # .agents/skills). Point MIX_PROJECT_DIR at the repository you work on.
      MIX_PROJECT_MOUNT: /project
      # Source of the models.dev catalog: the published api.json or a local
      # file mounted into this container (see the volumes comment below).
      MIX_MODELS_DEV_URL: "${MIX_MODELS_DEV_URL:-https://models.dev/api.json}"
    volumes:
      - data:/data
      - policy:/data/egress
      # Agent Skills are scanned from /data/skills, inside the data volume. To
      # author SKILL.md on the host instead, set MIX_SKILLS_DIR and add your own
      # mount here; bind-mounting the checkout would let imports write skills
      # into the source tree.
      - ${MIX_PROJECT_DIR:-.}:/project:ro
      - keys:/keys
      - db-secret:/db-secret:ro
      - execution-token:/execution-keys:ro
      - mcp-token:/mcp-keys:ro
      - manager-token:/manager-keys:ro
      - browser-token:/browser-keys:ro
      - browser-provisioner-token:/browser-provisioner-keys:ro
      # Local models.dev api.json instead of the published catalog:
      #   - ./models-dev:/models-dev:ro   (with MIX_MODELS_DEV_URL=/models-dev/api.json)
      # - ${MIX_MODELS_DEV_DIR:-./models-dev}:/models-dev:ro
    command: [sh, -c, "mkdir -p /tmp/runner-keys && cp /execution-keys/execution.token /mcp-keys/mcp.token /manager-keys/manager.token /browser-keys/browser.token /browser-provisioner-keys/browser-provisioner.token /tmp/runner-keys/ && export RUNNER_KEYS=/tmp/runner-keys && alembic upgrade head && uvicorn mix_agent.main:app --host 0.0.0.0 --port 8080 --workers 1"]
    networks: [database, execution, mcp, internet]
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      # `/live` is dependency-free, so a DB hiccup does not restart a healthy
      # app (the ready probe at `/health` would). The start period covers
      # `alembic upgrade head` on a fresh volume.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/live', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db: {condition: service_healthy}
  execution-runner:
    <<: *restricted
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: execution}
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
    volumes: ["workspace:/workspace", "execution-token:/tokens:ro"]
    networks: [execution]
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    depends_on:
      init: {condition: service_completed_successfully}
  browser-runner:
    <<: *restricted
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: browser-runner}
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      TOKEN_FILE: /tokens/browser.token
    volumes: ["browser-data:/browser:ro", "browser-token:/tokens:ro"]
    networks: [execution]
    mem_limit: 2g
    cpus: 2
    shm_size: 256m
    depends_on:
      init: {condition: service_completed_successfully}
  browser-provisioner:
    <<: *restricted
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: browser-provisioner}
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      TOKEN_FILE: /tokens/browser-provisioner.token
    volumes: ["browser-data:/browser", "browser-provisioner-token:/tokens:ro"]
    networks: [execution]
    mem_limit: 1g
    cpus: 1
    depends_on:
      init: {condition: service_completed_successfully}
  mcp-runner:
    <<: *restricted
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: mcp}
    environment:
      HTTP_PROXY: http://egress-proxy:3128
      HTTPS_PROXY: http://egress-proxy:3128
      http_proxy: http://egress-proxy:3128
      https_proxy: http://egress-proxy:3128
      HOME: /packages
    volumes: ["packages:/packages", "mcp-shared:/shared", "mcp-token:/tokens:ro"]
    networks: [mcp]
    mem_limit: 512m
    cpus: 1
    depends_on:
      init: {condition: service_completed_successfully}
  docker-socket-proxy:
    # Reduces the mcp-manager's Docker API surface.  The manager still needs
    # container creation for isolated MCP workloads, which is inherently
    # powerful; build, swarm, secrets, configs and system endpoints are denied.
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    # The image writes its generated HAProxy config at startup, so the root
    # filesystem cannot be read-only.  Everything that can be dropped is.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    environment:
      CONTAINERS: 1
      VOLUMES: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
      EXEC: 0
      BUILD: 0
      SYSTEM: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
      EVENTS: 0
      INFO: 0
      VERSION: 0
      PING: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [mcp]
  mcp-manager:
    <<: *restricted
    image: mix-agent-mcp-runtime:local
    user: "1000:1000"
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: mcp-runtime}
    environment:
      TOKEN_FILE: /tokens/manager.token
      POLICY_FILE: /policy/mcp-policy.json
      DOCKER_HOST: http://docker-socket-proxy:2375
      MCP_RUNTIME_IMAGE: mix-agent-mcp-runtime:local
      MCP_EGRESS_CONTAINER: mix-agent-egress-proxy-1
    volumes:
      - manager-token:/tokens:ro
      - policy:/policy
    command: ["uvicorn", "mcp_manager:app", "--host", "0.0.0.0", "--port", "8003"]
    networks: [mcp]
    mem_limit: 384m
    cpus: 0.5
    depends_on:
      init: {condition: service_completed_successfully}
      egress-proxy: {condition: service_started}
      docker-socket-proxy: {condition: service_started}
  egress-proxy:
    <<: *restricted
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: egress}
    environment:
      MCP_POLICY_FILE: /policy/mcp-policy.json
      LOG_LEVEL: INFO
    volumes: ["policy:/policy:ro"]
    networks: [execution, mcp, internet]
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      init: {condition: service_completed_successfully}
  postgres-test:
    image: postgres:17.5-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: mix
      POSTGRES_USER: mix
      # The database is thrown away with the container (tmpfs) and is only
      # reachable on the internal `database` network.  `trust` keeps the value
      # out of the repository instead of committing a shared placeholder
      # password; nothing outside this throwaway instance can use it.
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs: [/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mix -d mix"]
      interval: 5s
      timeout: 3s
      retries: 20
  test:
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: test}
    profiles: [test]
    environment:
      DATABASE_URL: postgresql+psycopg://mix@postgres-test/mix
      MIX_DATA: /tmp/mix-tests
      MIX_KEYS: /tmp/mix-tests/keys
      PUBLIC_ORIGIN: http://testserver
    command: [sh, -c, "cd /app && alembic upgrade head && pytest -c /app/pyproject.toml -p no:cacheprovider -q /workspace/tests"]
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [database]
    depends_on:
      postgres-test: {condition: service_healthy}
  preview-db:
    image: postgres:17.5-bookworm
    profiles: [preview]
    environment:
      POSTGRES_DB: mix
      POSTGRES_USER: mix
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs: [/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mix -d mix"]
      interval: 5s
      timeout: 3s
      retries: 20
  preview:
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: test}
    profiles: [preview]
    ports: ["127.0.0.1:18080:18080"]
    environment:
      DATABASE_URL: postgresql+psycopg://mix@preview-db/mix
      MIX_DATA: /tmp/mix-chat-preview
      MIX_KEYS: /tmp/mix-chat-preview/keys
      PUBLIC_ORIGIN: http://127.0.0.1:18080
    command: [sh, -c, "cd /app && alembic upgrade head && uvicorn --app-dir /workspace/tests/fixtures chat_preview:app --host 0.0.0.0 --port 18080"]
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [database, internet]
    depends_on:
      preview-db: {condition: service_healthy}

networks:
  database: {internal: true}
  execution: {internal: true}
  mcp: {internal: true}
  internet: {}

volumes:
  postgres:
  keys:
  db-secret:
  execution-token:
  mcp-token:
  manager-token:
  data:
  policy:
  workspace:
  packages:
  mcp-shared:
  browser-token:
  browser-provisioner-token:
  browser-data:

