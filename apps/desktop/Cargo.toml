[workspace]
resolver = "2"
members = [
    "app",
    "core",
    "providers",
    "tools",
    "browser",
    "mcp",
    "storage",
]

[workspace.package]
version = "0.5.7"
edition = "2021"
rust-version = "1.91"
authors = ["MIX-agent contributors"]
license = "Apache-2.0"
repository = "https://github.com/taitai2661/MIX-agent"

[workspace.dependencies]
# `rc` lets `ProviderRequest.tools` be an `Arc<Vec<ToolSpec>>`, so the Run Engine
# hands the very same spec to every turn instead of deep-copying it each time.
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# Maintained `serde_yaml` fork. Skills frontmatter needs real YAML: block
# scalars, quoted colons and nested `metadata` maps all break a line parser.
serde_yaml_ng = "0.10"
# Minimal feature set (see Cargo.toml:26): rt + macros + time + sync + fs +
# io-util + net. `signal`/`process` are needed by terminal handling;
# `test-util` is intentionally NOT here — dev-dependencies add it per crate.
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "io-std", "net", "signal", "process"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
# Unified versions: single reqwest 0.12 line (compatible with tauri 2.x and the
# updater plugin, which resolves its own reqwest 0.13 internally, so both
# versions coexist; this dependency stays on 0.12 for the code in this
# workspace).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "json", "chrono", "uuid"] }
rand = "0.8"
base64 = "0.22"
# `dirs` 6 (unified; was a mix of `dirs 5`): same data_dir/config_dir API used
# in app/src/lib.rs and storage migrations. `directories` was considered but
# would rename every call site for no benefit.
dirs = "6"

# Domain crate names. These are local aliases that the `app` binary uses.
mixd-core = { path = "core" }
mixd-providers = { path = "providers" }
mixd-tools = { path = "tools" }
mixd-browser = { path = "browser" }
mixd-mcp = { path = "mcp" }
mixd-storage = { path = "storage" }

# 既定の debug = true は完全 debuginfo を生成し、1つの .o が約800KB に達して
# target/ が数十GB に膨張する。line-tables-only は行番号を残すため anyhow/thiserror
# の ? チェーンや panic の backtrace はそのまま読める。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
# Speed over size. Retrieval scores every candidate in Rust and the Run Engine
# parses/streams large JSON payloads; `opt-level = "s"` trades that CPU away
# for a smaller binary. The updater payload is compressed, so the real cost of
# `3` is measured in the release checklist rather than assumed here.
opt-level = 3
# Beta builds keep unwinding so crash reports still carry a backtrace.
# `strip = "symbols"` removes debuginfo (binary size) but keeps the symbol
# table, so `RUST_BACKTRACE=1` output stays readable. `strip = "none"` was the
# old setting; it preserved full debuginfo at the cost of a much larger
# updater payload with no extra diagnostic value over symbols.
panic = "unwind"
strip = "symbols"
