<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b3d32" />
    <meta
      name="description"
      content="MIX-agent Desktop — ローカルで動く AI ワークスペース。チャット・推論・自律エージェントを単一ユーザーのネイティブアプリで。"
    />
    <title>MIX-agent Desktop</title>
    <!--
      OGP / Twitter Card。og:image は公開 URL が確定したら絶対 URL に
      書き換える（クローラは相対パスをページ URL 基準で解決する）。
      `?v=<hash>` は og-image.png の sha256 先頭 8 桁で、
      画像更新時に URL が変わるため X / Slack / LINE のキャッシュに
      古い画像が残らない。`pnpm build` 前に scripts/sync-og-meta.mjs
      （ui の prebuild）が自動で付け替えるので手編集不要。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MIX-agent Desktop" />
    <meta property="og:title" content="MIX-agent Desktop" />
    <meta
      property="og:description"
      content="ローカルで動く AI ワークスペース。チャット・推論・自律エージェントを単一ユーザーのネイティブアプリで。"
    />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="/og-image.png?v=e6cb9d60" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="MIX-agent Desktop — ローカル AI ワークスペース"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MIX-agent Desktop" />
    <meta
      name="twitter:description"
      content="ローカルで動く AI ワークスペース。チャット・推論・自律エージェントを単一ユーザーのネイティブアプリで。"
    />
    <meta name="twitter:image" content="/og-image.png?v=e6cb9d60" />
    <meta
      name="twitter:image:alt"
      content="MIX-agent Desktop — ローカル AI ワークスペース"
    />
    <script>
      // First-paint より前に traffic light 分の余白を確保する。
      // App.tsx 側で Tauri の OS 判定に上書きされるまでのフォールバック。
      try {
        document.documentElement.dataset.platform =
          /Macintosh|Mac OS X/i.test(navigator.userAgent) ? "macos" : "other";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
