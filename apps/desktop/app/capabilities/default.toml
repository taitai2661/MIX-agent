# Default capability for the main window.
#
# WebView → Rust command surface only. We deliberately do NOT enable the `fs`,
# `shell`, or `http` plugin surfaces here. All operations flow through custom
# `#[tauri::command]` handlers in `src/commands/*` so the Rust core remains the
# single authority.

"$schema" = "../gen/schemas/desktop-schema.json"

identifier = "default"
description = "Default capability for the main MIX-agent Desktop window"
windows = ["main"]

permissions = [
  "core:default",
  "core:window:default",
  # `core:window:default` does not grant `start_dragging`, which is what the
  # `data-tauri-drag-region` header invokes. Without it the ACL rejects the
  # call and the window cannot be moved from the title bar.
  "core:window:allow-start-dragging",
  "core:webview:default",
  "core:event:default",
  "core:app:default",
  "core:path:default",
  "core:resources:default",
  "core:menu:default",
  "core:tray:default",

  # Scoped plugin surface (least privilege): the frontend only uses
  # `dialog.open`/`dialog.save` (file pickers) and `os.platform`
  # (title-bar detection). `store`, `process` and `notification` have no
  # frontend callers, so their `:default` grants are dropped. `window-state`
  # persists geometry from Rust (no frontend IPC), `deep-link` delivers the
  # MCP OAuth redirect, and `cli` exposes `doctor`/flags.
  "os:allow-platform",
  "dialog:allow-open",
  "dialog:allow-save",
  "window-state:default",
  "deep-link:default",
  "cli:default"
]
