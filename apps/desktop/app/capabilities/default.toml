# Default capability for the main window.
#
# WebView → Rust command surface only. We deliberately do NOT enable the `fs`,
# `shell`, or `http` plugin surfaces here. All operations flow through custom
# `#[tauri::command]` handlers in `src/commands/*` so the Rust core remains the
# single authority.

"$schema" = "../gen/schemas/desktop-schema.json"

identifier = "default"
description = "Default capability for the main MIX-agent Desktop window"
windows = ["main"]

permissions = [
  "core:default",
  "core:window:default",
  # `core:window:default` does not grant `start_dragging`, which is what the
  # `data-tauri-drag-region` header invokes. Without it the ACL rejects the
  # call and the window cannot be moved from the title bar.
  "core:window:allow-start-dragging",
  # Windows / Linux use the custom `WindowControls` header (the native
  # decorations are disabled in `tauri.windows.conf.json` / `tauri.linux.conf.json`
  # so the OS buttons do not appear twice). These calls are made from the
  # WebView, so they need an explicit grant; `core:window:default` only allows
  # the read-only queries such as `is_maximized`.
  "core:window:allow-minimize",
  "core:window:allow-toggle-maximize",
  "core:window:allow-close",
  "core:webview:default",
  "core:event:default",
  "core:app:default",
  "core:path:default",
  "core:resources:default",
  "core:menu:default",
  "core:tray:default",

  # Scoped plugin surface (least privilege): the frontend uses `os.platform`
  # (title-bar detection) and `notification.send` (run-finished alerts). The
  # native file pickers run in Rust, so the WebView is not granted
  # `dialog:allow-open/save`; `store`, `process`, `shell`, `http`, `fs`, `cli`
  # and `deep-link` are neither registered nor granted for frontend IPC.
  # `window-state` persists geometry from Rust (no frontend IPC), and the deep
  # link / CLI plugins are used by the Rust side only.
  "os:allow-platform",
  "notification:default",
  "window-state:default"
]
