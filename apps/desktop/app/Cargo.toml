[package]
name = "mix-agent-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MIX-agent Desktop — Tauri 2 shell"

[[bin]]
name = "mix-agent-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Rolling file appender for the log under the app-data directory.
# NOTE: `tracing-appender` has no `rolling` feature — the rotating writer is
# compiled unconditionally (its only feature is `parking_lot`), so the version
# requirement alone is what pulls it in.
tracing-appender = "0.2.3"
# Same resolution Tauri's `PathResolver::app_data_dir` uses, needed before the
# `AppHandle` exists (tracing has to be initialised before the Builder runs).
dirs.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true

mixd-core = { workspace = true }
mixd-providers = { workspace = true }
mixd-tools = { workspace = true }
mixd-browser = { workspace = true }
mixd-mcp = { workspace = true }
mixd-storage = { workspace = true }
futures = "0.3"
sqlx.workspace = true
base64.workspace = true
url = "2.5"
reqwest.workspace = true
ignore = "0.4.30"

tauri = { version = "2.1", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
# `unsafe-headers` deliberately NOT enabled: the Rust side only calls
# `tauri_plugin_http::init()` and the UI never sends restricted headers
# (Authorization etc.) through the plugin fetch. Re-add if that changes.
tauri-plugin-http = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-deep-link = "2.0"
tauri-plugin-single-instance = { version = "2.0", features = ["deep-link"] }
tauri-plugin-cli = "2.0"
