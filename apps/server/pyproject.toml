[project]
name = "mix-agent"
version = "0.5.4"
license = "Apache-2.0"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "argon2-cffi>=23,<26", "cryptography>=44,<47",
  "python-multipart>=0.0.20,<1", "jsonschema>=4.23,<5", "beautifulsoup4>=4.12,<5", "ddgs>=9,<10",
  "openai>=1.70,<3", "anthropic>=0.49,<1", "google-genai>=1.10,<2",
  "mcp>=1.9,<2", "pypdf>=5,<7", "playwright>=1.51,<2", "pyyaml>=6,<7"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pyright>=1.1.390,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../../tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
  "E4",    # import errors
  "E7",    # statement errors
  "E9",    # runtime errors
  "F",     # pyflakes
  "BLE",   # blind `except Exception`
  "S",     # bandit-style security
  "ASYNC", # async pitfalls (blocking calls, un-awaited tasks)
]
ignore = [
  "S608",  # migrations build DDL from trusted literals
]

[tool.ruff.lint.per-file-ignores]
"../../tests/**" = ["S101", "S105", "S106", "S108", "S311"]
"../../experiments/**" = ["S101"]
"mix_agent/tools/execute.py" = ["ASYNC109"]  # public tool API takes a timeout
"mix_agent/tools/network.py" = ["ASYNC109"]
"mix_agent/wakeups.py" = ["ASYNC109"]
"mix_agent/api/routes.py" = ["E402"]  # conditional imports after helper defs
"mix_agent/main.py" = ["E402", "ASYNC240"]  # tiny local stat in the SPA fallback
"mix_agent/providers/catalog.py" = ["S101"]  # module-level catalog invariants

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are idiomatic here and are treated as
# immutable just like the broader community does; genuine mutable defaults in
# other call sites stay flagged by B008.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Body",
  "fastapi.Security",
]
