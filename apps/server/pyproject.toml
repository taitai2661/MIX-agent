[project]
name = "mix-agent"
version = "0.5.4"
license = "Apache-2.0"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "argon2-cffi>=23,<26", "cryptography>=44,<47",
  "python-multipart>=0.0.20,<1", "jsonschema>=4.23,<5", "beautifulsoup4>=4.12,<5", "ddgs>=9,<10",
  "openai>=1.70,<3", "anthropic>=0.49,<1", "google-genai>=1.10,<2",
  "mcp>=1.9,<2", "pypdf>=5,<7", "playwright>=1.51,<2", "pyyaml>=6,<7"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pyright>=1.1.390,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
# Mirrors the repository-root `pytest.ini`. The Docker test image runs
# `pytest -c /app/pyproject.toml` because the checkout is mounted at /workspace,
# so the root config is not discoverable from /app; keep both in sync.
asyncio_mode = "auto"
testpaths = ["../../tests"]

