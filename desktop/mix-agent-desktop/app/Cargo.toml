[package]
name = "mix-agent-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MIX-agent Desktop — Tauri 2 shell"

[[bin]]
name = "mix-agent-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true

mixd-core = { workspace = true }
mixd-providers = { workspace = true }
mixd-tools = { workspace = true }
mixd-browser = { workspace = true }
mixd-mcp = { workspace = true }
mixd-storage = { workspace = true }
futures = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "json", "chrono", "uuid"] }
base64 = "0.22"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

tauri = { version = "2.1", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = { version = "2.0", features = ["unsafe-headers"] }
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-store = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-window-state = "2.0"
tauri-plugin-deep-link = "2.0"
tauri-plugin-single-instance = { version = "2.0", features = ["deep-link"] }
tauri-plugin-cli = "2.0"
