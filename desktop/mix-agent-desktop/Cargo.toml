[workspace]
resolver = "2"
members = [
    "app",
    "core",
    "providers",
    "tools",
    "browser",
    "mcp",
    "storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
authors = ["MIX-agent contributors"]
license = "Apache-2.0"
repository = "https://github.com/taitai2661/MIX-agent"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Domain crate names. These are local aliases that the `app` binary uses.
mixd-core = { path = "core" }
mixd-providers = { path = "providers" }
mixd-tools = { path = "tools" }
mixd-browser = { path = "browser" }
mixd-mcp = { path = "mcp" }
mixd-storage = { path = "storage" }

# 既定の debug = true は完全 debuginfo を生成し、1つの .o が約800KB に達して
# target/ が数十GB に膨張する。line-tables-only は行番号を残すため anyhow/thiserror
# の ? チェーンや panic の backtrace はそのまま読める。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
