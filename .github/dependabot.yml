version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/apps/server"
    schedule:
      interval: "weekly"
    groups:
      browser-runtime:
        patterns:
          - "playwright"
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    groups:
      browser-tests:
        patterns:
          - "@playwright/test"
    open-pull-requests-limit: 3
