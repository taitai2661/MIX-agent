name: desktop-release

# Builds MIX-agent Desktop installers for macOS and Windows.
#
# Tag scheme: `desktop-v*` (e.g. desktop-v0.6.0) or `v*` (e.g. v0.6.0).
# Tagging with `v*` triggers both Docker releases and Desktop installer builds,
# uploading them as GitHub Release assets.
#
# Release scope: Apple Silicon + Intel macOS DMGs, a Windows x64 NSIS
# installer plus MSI, and a Linux x64 AppImage plus .deb.
#
# Chromium is NOT bundled. The app downloads a pinned Chrome for Testing build
# on first use, verified against the SHA-256 manifest compiled into the binary
# (`apps/desktop/browser/src/chromium-manifest.json`, generated by
# `apps/desktop/scripts/pin-chromium.mjs`). The release workflow therefore only
# needs the WebKit/GTK libraries Tauri itself links against; the browser's
# runtime libraries are a user-machine concern documented in the release notes.
#
# Updates are signed with the Tauri updater key. The private key and its
# password live ONLY in Repository Secrets (`TAURI_SIGNING_PRIVATE_KEY`,
# `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`); `pubkey` in tauri.conf.json is the
# matching public key. `latest.json` is generated from the signed artifacts
# and uploaded alongside them, so the in-app updater can verify every bundle.
# Losing or rotating the private key makes already-installed builds unable to
# accept new updates; keep the offline backup outside this repository.
#
# Desktop builds are still not Developer ID-signed or notarized, and the
# Windows installer is unsigned, so Gatekeeper/SmartScreen warnings remain.
# That is independent of the updater signature above, which authenticates the
# update payload itself.

on:
  push:
    tags:
      - "desktop-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. desktop-v0.6.0 or v0.6.0)"
        required: true
      dry_run:
        description: "Build/validate artifacts without creating or updating a GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  RUST_BACKTRACE: "1"

jobs:
  # The browser is downloaded by the app, not by this workflow, so this job is
  # the remaining supply-chain gate: it re-downloads every pinned archive and
  # compares URL, size and SHA-256 with `chromium-manifest.json`.
  verify-chromium-pin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify pinned Chrome for Testing archives
        run: node apps/desktop/scripts/pin-chromium.mjs --verify

  bundle:
    name: ${{ matrix.target }}
    needs: verify-chromium-pin
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_arch: Apple-Silicon
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_arch: Intel
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_arch: Windows-x64
            bundles: nsis,msi
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset_arch: Linux-x64
            bundles: appimage,deb
          # Deferred: universal-macos (requires lipo of both targets),
          # win-arm64, and Linux ARM64 Desktop installers.

    steps:
      # workflow_dispatch builds the tag passed as `inputs.tag`; tag pushes
      # build github.ref. Without this, the `tag` input would be accepted but
      # never used.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop
          key: bundle-${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Keep the tag, package manifests, Tauri config and Cargo workspace in
      # lockstep. A dry-run may pass a branch name (`tag=main`); the script only
      # compares a ref when it looks like a release tag.
      - name: Verify tag matches app version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/check-version-consistency.mjs --tag "$RELEASE_TAG"

      # A missing or draft-marked notes file used to fall back to a placeholder
      # body; that made an accidental tag look like a successful release.
      - name: Release notes are present and publishable
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/check-release-notes.mjs --tag "$RELEASE_TAG"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Single source of truth for the pnpm version is packageManager in
          # apps/desktop/package.json (pnpm@10.11.0) via corepack;
          # the explicit `version:` here only pins CI while corepack auto-pin
          # is disabled (COREPACK_ENABLE_AUTO_PIN=0). Drop `version:` once CI
          # runs `corepack enable` + `corepack install` instead.
          version: "10.11.0"

      # Tauri/WebKitGTK needs these to build and to package .deb / .AppImage.
      # NOTE: jobs stay on ubuntu-22.04 (not 24.04): WebKitGTK/AppIndicator
      # package names and archive availability differ; re-check before bumping.
      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libxdo-dev libgtk-3-dev libayatana-appindicator3-dev \
            libfuse2 fuse3

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"

      # `tauri build` runs beforeBuildCommand (the Vite UI build) exactly once;
      # there is no Chromium fetch step any more.
      # Ad-hoc macOS signature and unsigned Windows installers are unchanged;
      # the updater signature below is a separate, mandatory layer that
      # authenticates the downloaded update payload.
      - name: Build and bundle
        working-directory: apps/desktop
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "::warning::Apple Developer ID signing/notarization is disabled; the app is ad-hoc signed, so Gatekeeper asks for a one-time Open Anyway confirmation."
          elif [ "${{ runner.os }}" = "Windows" ]; then
            echo "::warning::The Windows installer is unsigned; SmartScreen may warn or block launch."
          fi
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          # Required by `createUpdaterArtifacts`; without these the build has no
          # .sig files and the update would be rejected by every client.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Fail closed on a missing or invalid macOS bundle signature: Apple
      # Silicon reports an unsigned copied app as damaged. The managed Chromium
      # is downloaded after install, so it is not part of this check.
      - name: Verify macOS signature and bundle architecture
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          app="target/${{ matrix.target }}/release/bundle/macos/MIX-agent Desktop.app"
          test -d "$app"

          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          echo "$signature"
          echo "$signature" | grep -q '^Signature=adhoc$'

          case "${{ matrix.target }}" in
            aarch64-apple-darwin) want=arm64 ;;
            x86_64-apple-darwin) want=x86_64 ;;
            *) echo "::error::Unexpected macOS target ${{ matrix.target }}"; exit 1 ;;
          esac

          app_archs="$(lipo -archs "$app/Contents/MacOS/mix-agent-desktop")"
          echo "app archs: $app_archs"
          echo "$app_archs" | grep -qw "$want"

      # Stage installers *and* the updater payloads under the exact names
      # latest.json advertises. Every updater payload must have a matching
      # `.sig` next to it; a missing signature fails the job rather than
      # publishing an update every client would reject.
      - name: Stage installers and updater artifacts
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # macOS runners still use bash 3.2, which has no `mapfile`. Read the
          # NUL-delimited find output with a portable loop instead. The same
          # shape works in Git Bash on the Windows runner.
          if [ "${{ runner.os }}" = "macOS" ]; then
            dmgs=()
            while IFS= read -r -d '' dmg; do
              dmgs+=("$dmg")
            done < <(find "target/${{ matrix.target }}/release/bundle" -type f -name '*.dmg' -print0)
            if [ "${#dmgs[@]}" -ne 1 ]; then
              echo "::error::Expected one DMG for ${{ matrix.asset_arch }}, found ${#dmgs[@]}."
              exit 1
            fi
            cp "${dmgs[0]}" "release-assets/MIX-agent-Desktop-${{ matrix.asset_arch }}.dmg"

            # Tauri's macOS updater payload: `<app>.app.tar.gz` + `.sig`.
            archives=()
            while IFS= read -r -d '' archive; do
              archives+=("$archive")
            done < <(find "target/${{ matrix.target }}/release/bundle/macos" -type f -name '*.app.tar.gz' -print0)
            if [ "${#archives[@]}" -ne 1 ]; then
              echo "::error::Expected one macOS updater archive, found ${#archives[@]}. Is TAURI_SIGNING_PRIVATE_KEY set?"
              exit 1
            fi
            cp "${archives[0]}" "release-assets/MIX-agent-Desktop-${{ matrix.asset_arch }}.app.tar.gz"
            test -s "${archives[0]}.sig"
            cp "${archives[0]}.sig" "release-assets/MIX-agent-Desktop-${{ matrix.asset_arch }}.app.tar.gz.sig"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            setups=()
            while IFS= read -r -d '' setup; do
              setups+=("$setup")
            done < <(find "target/${{ matrix.target }}/release/bundle/nsis" -type f -name '*-setup.exe' -print0)
            if [ "${#setups[@]}" -ne 1 ]; then
              echo "::error::Expected one NSIS setup executable, found ${#setups[@]}."
              exit 1
            fi
            cp "${setups[0]}" "release-assets/MIX-agent-Desktop-Windows-x64-Setup.exe"

            # v2 reuses the NSIS installer itself as the updater payload;
            # the signature is `<installer>.sig`.
            test -s "${setups[0]}.sig"
            cp "${setups[0]}.sig" "release-assets/MIX-agent-Desktop-Windows-x64-Setup.exe.sig"

            msis=()
            while IFS= read -r -d '' msi; do
              msis+=("$msi")
            done < <(find "target/${{ matrix.target }}/release/bundle/msi" -type f -name '*.msi' -print0)
            if [ "${#msis[@]}" -ne 1 ]; then
              echo "::error::Expected one MSI installer, found ${#msis[@]}. Check bundle.windows.wix.language."
              exit 1
            fi
            cp "${msis[0]}" "release-assets/MIX-agent-Desktop-Windows-x64.msi"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            appimages=()
            while IFS= read -r -d '' appimage; do
              appimages+=("$appimage")
            done < <(find "target/${{ matrix.target }}/release/bundle/appimage" -type f -name '*.AppImage' -print0)
            if [ "${#appimages[@]}" -ne 1 ]; then
              echo "::error::Expected one AppImage, found ${#appimages[@]}."
              exit 1
            fi
            cp "${appimages[0]}" "release-assets/MIX-agent-Desktop-Linux-x64.AppImage"

            # The AppImage itself is the updater payload (v2), signed in place.
            test -s "${appimages[0]}.sig"
            cp "${appimages[0]}.sig" "release-assets/MIX-agent-Desktop-Linux-x64.AppImage.sig"

            debs=()
            while IFS= read -r -d '' deb; do
              debs+=("$deb")
            done < <(find "target/${{ matrix.target }}/release/bundle/deb" -type f -name '*.deb' -print0)
            if [ "${#debs[@]}" -ne 1 ]; then
              echo "::error::Expected one .deb package, found ${#debs[@]}."
              exit 1
            fi
            cp "${debs[0]}" "release-assets/MIX-agent-Desktop-Linux-x64.deb"
          else
            echo "::error::No artifact staging rule for ${{ runner.os }}."
            exit 1
          fi

      - name: Collect artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mix-agent-desktop-${{ matrix.target }}
          path: apps/desktop/release-assets/*
          if-no-files-found: error
          retention-days: 14

  checksums:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Build a checksum manifest for all installers
        shell: bash
        run: |
          set -euo pipefail
          # Keep this loop bash-3.2 compatible: the release workflow is easy to
          # move between macOS and Linux runners. The expected set is explicit
          # so a missing Windows or macOS artifact fails here instead of
          # producing a Release with a silently incomplete SHA256SUMS.
          expected=(
            "MIX-agent-Desktop-Apple-Silicon.dmg"
            "MIX-agent-Desktop-Intel.dmg"
            "MIX-agent-Desktop-Windows-x64-Setup.exe"
            "MIX-agent-Desktop-Windows-x64.msi"
            "MIX-agent-Desktop-Linux-x64.AppImage"
            "MIX-agent-Desktop-Linux-x64.deb"
          )
          : > artifacts/SHA256SUMS
          for name in "${expected[@]}"; do
            matches=()
            while IFS= read -r -d '' file; do
              matches+=("$file")
            done < <(find artifacts -type f -name "$name" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $name, found ${#matches[@]}."
              exit 1
            fi
            (cd "$(dirname "${matches[0]}")" && sha256sum "$(basename "${matches[0]}")") >> artifacts/SHA256SUMS
          done
          cat artifacts/SHA256SUMS
      - name: Build the updater manifest (latest.json)
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/build-latest-json.mjs \
            --artifacts artifacts \
            --tag "$RELEASE_TAG" \
            --repo taitai2661/MIX-agent \
            --out artifacts/latest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mix-agent-desktop-checksums
          path: |
            artifacts/SHA256SUMS
            artifacts/latest.json
          retention-days: 14

  release:
    needs: [bundle, checksums]
    # Tag pushes publish. Manual runs are packaging dry-runs by default; set
    # dry_run=false explicitly to create/update a manual-download GitHub Release.
    if: startsWith(github.ref, 'refs/tags/desktop-v') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      # Release body comes from the checked-out notes for this tag. The
      # fallback still carries the beta warning so a missing notes file cannot
      # publish a Release that looks stable.
      - name: Compose release body
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#desktop-}"
          version="${version#v}"
          notes="docs/release-notes-v${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::$notes is missing; every release needs published notes."
            exit 1
          fi
          cat "$notes" > release-body.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: release-body.md
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            artifacts/**/*.deb
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/latest.json
            artifacts/**/SHA256SUMS
          fail_on_unmatched_files: true
