name: desktop-release

# Builds installable MIX-agent Desktop artifacts for all three platforms.
#
# Bundled Chromium is fetched by `beforeBuildCommand`, which means the Linux and
# Windows jobs need the extra system libraries Chromium links against. macOS
# signing / notarization is opt-in: without the secrets the job still produces a
# usable but unsigned build, so a fork can run it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  RUST_BACKTRACE: "1"

jobs:
  bundle:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/mix-agent-desktop
          key: bundle-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"

      # Chromium needs these at build time on Linux; tauri also needs them to
      # package .deb and .AppImage.
      - name: Install Linux bundling + Chromium dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libxdo-dev libgtk-3-dev libayatana-appindicator3-dev \
            fuse3

      - name: Install frontend dependencies
        working-directory: desktop/mix-agent-desktop
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"

      - name: Build UI
        working-directory: desktop/mix-agent-desktop/ui
        run: pnpm build

      # Fetched explicitly rather than via beforeBuildCommand so the download is
      # cached and a network blip does not fail the whole Rust build.
      - name: Fetch bundled Chromium
        working-directory: desktop/mix-agent-desktop
        run: node scripts/fetch-chromium.mjs

      - name: Build and bundle
        working-directory: desktop/mix-agent-desktop
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          MIX_SKIP_CHROMIUM: "1"

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.repository }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/cert.p12

      - name: Notarize and staple the macOS build
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="target/${{ matrix.target }}/release/bundle/macos/MIX-agent Desktop.app"
          # The nested Chromium bundle must be signed before the outer app, or
          # the outer signature is invalidated.
          if [ -d "$APP/Contents/Resources/chromium" ]; then
            find "$APP/Contents/Resources/chromium" -name "*.app" -depth -exec \
              codesign --force --deep --sign "$APPLE_TEAM_ID" --options runtime --timestamp {} \;
          fi
          codesign --force --deep --sign "$APPLE_TEAM_ID" --options runtime --timestamp "$APP"
          xcrun notarytool submit "$APP" --keychain-profile "notary" --wait
          xcrun stapler staple "$APP"

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mix-agent-desktop-${{ matrix.target }}
          path: |
            desktop/mix-agent-desktop/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/mix-agent-desktop/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            desktop/mix-agent-desktop/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/mix-agent-desktop/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/mix-agent-desktop/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/mix-agent-desktop/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: warn
          retention-days: 14

  checksums:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build a checksum manifest
        run: |
          cd artifacts
          find . -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
            -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' \) \
            -print0 | sort -z | xargs -0 -I{} sh -c 'sha256sum "$1" >> SHA256SUMS' _ {}
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mix-agent-desktop-checksums
          path: artifacts/SHA256SUMS

  release:
    needs: [bundle, checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.app.tar.gz
            artifacts/**/SHA256SUMS
          fail_on_unmatched_files: true
