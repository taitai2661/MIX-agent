name: Validate release candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject case-colliding Apps/ tree
        shell: bash
        run: |
          set -euo pipefail
          # Both store builders expect an `Apps/` tree. Keeping it in Git makes
          # checkout fail on case-insensitive filesystems; stage it instead.
          if git ls-files 'Apps/*' | grep -q .; then
            echo "::error::Do not commit a top-level Apps/ tree; use scripts/stage-store-source.sh."
            exit 1
          fi
      - name: Check generated store manifest
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.2
          VERSION="$(awk '/^  version:/ {gsub(/["\047]/, "", $2); print $2; exit}' apps/MIX-agent/docker-compose.yml)"
          test -n "$VERSION"
          python scripts/render_zimaos_compose.py "v$VERSION"
          git diff --exit-code -- apps/MIX-agent/docker-compose.yml
          docker compose -f apps/MIX-agent/docker-compose.yml config --quiet
      - name: Stage ZimaOS store source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/stage-store-source.sh out/store-source
          test -f out/store-source/Apps/MIX-agent/docker-compose.yml
          test -f out/store-source/store-config.json
          test -f out/store-source/supported-languages.json
      - name: Build legacy ZimaOS/CasaOS store
        uses: IceWhaleTech/CasaOS-AppStore/.github/actions/build-store-v1@0909364b800950030e71ea82355a5969a1c08b39
        with:
          source: out/store-source
          output-zip: dist/store/main.zip
          report-json: out/build-v1-report.json
          report-title: MIX-agent legacy ZimaOS store validation
      - name: Validate legacy store archive
        run: unzip -t dist/store/main.zip
      - name: Run application test suite
        working-directory: .
        run: docker compose --profile test run --build --rm test
      - name: Build all release images
        working-directory: .
        run: |
          for target in init app execution browser-runner browser-provisioner mcp mcp-runtime egress; do
            docker build --target "$target" -f deploy/docker/Dockerfile -t "mix-agent-$target:validation" .
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.11.0"
      - name: Check frontend
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm build
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"
