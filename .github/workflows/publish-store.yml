name: Publish ZimaOS store

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.3"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.2.3"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "build/**"
      - "deploy/**"
      - "compose.yaml"
      - "scripts/render_zimaos_compose.py"
      - "scripts/stage-store-source.sh"
      - "scripts/check-release-notes.mjs"
      - "category-list.json"
      - "featured-apps.json"
      - "recommend-list.json"
      - "store-config.json"
      - "supported-languages.json"
      - ".github/workflows/publish-store.yml"

permissions:
  contents: write
  packages: read

# Never cancel in flight: an interrupted push can leave the store branch
# half-updated. The group is deliberately NOT keyed on github.ref — a push to
# main and a tag-triggered workflow_call both push to the same gh-pages branch,
# so they must queue against each other, not just against other runs of the
# same ref.
concurrency:
  group: publish-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.images.outputs.ready }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.sha }}

      - name: Resolve store version
        id: version
        working-directory: .
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          COMPOSE_VERSION="$(awk '/^  version:/ {gsub(/["\047]/, "", $2); print $2; exit}' apps/MIX-agent/docker-compose.yml)"
          test -n "$COMPOSE_VERSION"

          if [[ -n "${INPUT_TAG:-}" ]]; then
            RELEASE_TAG="$INPUT_TAG"
            VERSION="${RELEASE_TAG#v}"
            if [[ "$VERSION" != "$COMPOSE_VERSION" ]]; then
              echo "Tag version $VERSION does not match store compose version $COMPOSE_VERSION."
              exit 1
            fi
          else
            VERSION="$COMPOSE_VERSION"
            RELEASE_TAG="v$VERSION"
          fi

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify public image manifests
        id: images
        working-directory: .
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          missing=0
          for target in init app execution browser-runner browser-provisioner mcp mcp-runtime egress; do
            image="ghcr.io/taitai2661/mix-agent-$target:$RELEASE_TAG"
            if ! docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Missing image: $image"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ -n "${REQUESTED_TAG:-}" ]]; then
              echo "A requested release cannot be published until every GHCR image exists."
              exit 1
            fi
            echo "Skipping automatic main-branch store publish until release images exist."
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Stage store source for both store builders
        if: steps.images.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Both upstream builders expect a top-level `Apps/` tree. Keep this
          # inline so a manual re-publish can run against an older tag that does
          # not yet contain scripts/stage-store-source.sh.
          stage=out/store-source
          rm -rf "$stage"
          mkdir -p "$stage/Apps"
          cp -R build "$stage/build"
          cp -R apps/MIX-agent "$stage/Apps/MIX-agent"
          for file in \
            README.md \
            category-list.json \
            featured-apps.json \
            recommend-list.json \
            store-config.json \
            supported-languages.json
          do
            cp "$file" "$stage/$file"
          done

      - name: Build ZimaOS v2 community store
        if: steps.images.outputs.ready == 'true'
        uses: IceWhaleTech/build-appstore-action@c9bb47fad5b32d7928a07978fad68801f52e910f
        with:
          source: out/store-source
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json

      - name: Build legacy ZimaOS/CasaOS v1 store
        if: steps.images.outputs.ready == 'true'
        uses: IceWhaleTech/CasaOS-AppStore/.github/actions/build-store-v1@0909364b800950030e71ea82355a5969a1c08b39
        with:
          source: out/store-source
          output-zip: dist/store/main.zip
          report-json: out/build-v1-report.json
          report-title: MIX-agent legacy ZimaOS store build

      - name: Check store output
        if: steps.images.outputs.ready == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -s dist/store.json
          test -s dist/index.json
          test -s dist/store/main.zip
          python3 - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          index = json.loads(Path("dist/index.json").read_text(encoding="utf-8"))
          apps = index.get("apps", [])
          app = next((item for item in apps if item.get("id") == "io.github.taitai2661.mix-agent"), None)
          if app is None:
              raise SystemExit("MIX-agent is missing from generated index.json")
          if app.get("version") != expected:
              raise SystemExit(f"Generated version {app.get('version')!r} does not match {expected!r}")

          archive = Path("dist/store/main.zip")
          with zipfile.ZipFile(archive) as zf:
              if zf.testzip() is not None:
                  raise SystemExit("Legacy main.zip failed integrity check")
              expected_entry = "build/sysroot/var/lib/casaos/appstore/default.new/Apps/MIX-agent/docker-compose.yml"
              if expected_entry not in zf.namelist():
                  raise SystemExit(f"Legacy main.zip is missing {expected_entry}")
          PY

      - name: Publish store
        if: steps.images.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Validate jsDelivr purge inputs
        if: steps.images.outputs.ready == 'true'
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A malformed owner/repo or an unsafe path would build a purge URL
          # for something other than this store. Reject those hard, before the
          # best-effort refresh step below.
          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Malformed repository '$REPOSITORY'; refusing to build a jsDelivr purge URL."
            exit 1
          fi
          for path in \
            index.json \
            store.json \
            store/main.zip \
            apps/io.github.taitai2661.mix-agent/docker-compose.yml \
            apps/io.github.taitai2661.mix-agent/meta.json
          do
            if [[ "$path" == /* || "$path" == *..* || "$path" == *[[:space:]]* ]]; then
              echo "::error::Unsafe jsDelivr purge path '$path'."
              exit 1
            fi
            url="https://purge.jsdelivr.net/gh/${REPOSITORY}@gh-pages/${path}"
            if [[ ! "$url" =~ ^https://purge\.jsdelivr\.net/gh/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@gh-pages/[A-Za-z0-9_./-]+$ ]]; then
              echo "::error::Malformed jsDelivr purge URL '$url'."
              exit 1
            fi
          done
      - name: Refresh jsDelivr store paths
        if: steps.images.outputs.ready == 'true'
        # Best effort: the gh-pages content is already live. A failed purge is
        # surfaced as a step annotation, never hidden behind `|| true`.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::jsDelivr purge is best-effort; failed paths are reported as warnings and do not fail the publish."
          failed=0
          for path in \
            index.json \
            store.json \
            store/main.zip \
            apps/io.github.taitai2661.mix-agent/docker-compose.yml \
            apps/io.github.taitai2661.mix-agent/meta.json
          do
            if ! curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@gh-pages/${path}" >/dev/null; then
              echo "::warning::jsDelivr purge failed for $path; the CDN may serve stale content until its cache expires."
              failed=1
            fi
          done
          exit "$failed"

      - name: Stage store release assets
        if: steps.images.outputs.ready == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Build the two archives here, where `dist/` exists, and hand them to
          # the detached job below. Waiting for the Release here used to fail
          # the whole publish job *after* gh-pages had already been updated.
          node scripts/check-release-notes.mjs --tag "$RELEASE_TAG"
          mkdir -p out/release-assets
          tar -czf "out/release-assets/mix-agent-zimaos-store-${RELEASE_TAG}.tar.gz" -C dist .
          cp dist/store/main.zip "out/release-assets/mix-agent-zimaos-legacy-${RELEASE_TAG}.zip"

      - name: Upload store release assets
        if: steps.images.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-release-assets
          path: out/release-assets/*
          if-no-files-found: error
          retention-days: 7

  # Detached from `publish` on purpose: the store branch is already live here.
  # desktop-release.yml is the SOLE Release creator and its installer build can
  # still be running, so wait (bounded) for the Release and only attach our two
  # archives. Never create the Release here and never rewrite its notes: two
  # creators raced before and whichever wrote last won. A late/missing Release
  # is a warning with a manual retry command, not a red build over a store that
  # was published successfully.
  attach-release-assets:
    name: Attach store assets to GitHub Release
    needs: publish
    if: needs.publish.result == 'success' && needs.publish.outputs.ready == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: store-release-assets
          path: release-assets
      - name: Upload store assets to the existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          bundle="release-assets/mix-agent-zimaos-store-${RELEASE_TAG}.tar.gz"
          legacy="release-assets/mix-agent-zimaos-legacy-${RELEASE_TAG}.zip"
          for asset in "$bundle" "$legacy"; do
            if [[ ! -s "$asset" ]]; then
              echo "::warning::Missing staged asset $asset; store is published, attach it manually."
              exit 0
            fi
          done

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG not found yet; waiting for desktop-release.yml to create it."
            for attempt in $(seq 1 40); do
              sleep 30
              if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                break
              fi
              echo "Still waiting for release $RELEASE_TAG ($attempt/40)."
            done
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::warning::Release $RELEASE_TAG does not exist after 20m. Store is published; attach manually with: gh release upload $RELEASE_TAG $(basename "$bundle") $(basename "$legacy") --clobber"
            exit 0
          fi

          gh release upload "$RELEASE_TAG" "$bundle" "$legacy" --clobber
