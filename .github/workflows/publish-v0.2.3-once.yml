name: Publish MIX-agent v0.2.3 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.2.3-once.yml'

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [init, app, execution, browser-runner, browser-provisioner, mcp, mcp-runtime, egress]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/taitai2661/mix-agent-${{ matrix.target }}:v0.2.3
          labels: |
            org.opencontainers.image.source=https://github.com/taitai2661/MIX-agent
            org.opencontainers.image.version=v0.2.3

  zimaos-store:
    needs: images
    uses: ./.github/workflows/publish-store.yml
    with:
      tag: v0.2.3
    secrets: inherit
