name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# CI is blocking: a failing job fails the workflow, so the release preflight
# in `require-green-ci` cannot publish a build that failed tests, lint, parity
# gates, secret scanning or dependency audits. Numeric gates are contractual
# (coverage 60%, recall/MRR 0.95, noise 0.6, pyright warning budget 23).
#
# A push that supersedes an in-flight run on the same ref cancels it; without
# this the three-OS Rust matrix keeps burning runners on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # `alembic check` must run before pytest: the test fixture drops and
      # recreates every table from the models, so a later check would compare
      # the metadata with itself and miss a migration that never created a
      # column or index.
      # The test image copies `apps/server/` to `/app/` (see the `test` stage in
      # deploy/docker/Dockerfile), so the server's own tests are at `/app/tests`
      # — there is no `/workspace/apps/server/tests` inside the image.
      - name: Verify migrations, then measure coverage
        run: |
          docker compose --profile test run --build --rm test \
            sh -c "cd /app && export COVERAGE_FILE=/tmp/.coverage \
              && alembic upgrade head \
              && alembic check \
              && pytest -c /app/pyproject.toml -p no:cacheprovider -q \
                   --cov=mix_agent --cov-report=term-missing \
                   --cov-fail-under=60 /workspace/tests /app/tests"

      # Spec §5's ranking is a *number*, so a weighting change can be caught as
      # "a specific score moved" rather than as "the order looked different".
      # The gate reads the shared recall fixture only — no database, no network,
      # no LLM — and is fully deterministic (exact scores to four decimals), so
      # the same thresholds are valid verbatim in the Desktop job below.
      #
      # Deliberately NOT gated here: latency. The fixture suite measures none,
      # and synthetic-corpus latency is machine-dependent; the bench still
      # reports it when run by hand with --suite synthetic.
      - name: Retrieval quality gate (spec §5)
        run: |
          docker compose --profile test run --build --rm test \
            sh -c "cd /app && python /workspace/experiments/run_retrieval_bench.py --suite fixture \
              --min-recall5 0.95 --min-recall8 0.95 --min-mrr 0.95 --max-noise 0.6"

  docker-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/server/uv.lock') }}
      - name: Install uv
        run: pip install uv==0.12.7
      - name: Ruff check (whole repository)
        # Run from the root so per-file-ignore globs (tests/**, runners/**) match;
        # `uv run --project` keeps using the server's pinned ruff.
        run: uv run --project apps/server ruff check apps/server runners deploy scripts tests experiments packages
      - name: Ruff format check (whole repository)
        run: uv run --project apps/server ruff format --check apps/server runners deploy scripts tests experiments packages
      # The server is a single-worker process with synchronous SQLAlchemy.
      # An `async def` route that does not truly await blocks every request.
      - name: Async route / sync DB check
        run: python3 scripts/check-async-db.py
      - name: Pyright (type check + warning budget)
        working-directory: apps/server
        run: uv run python ../../scripts/check-pyright-budget.py --max-warnings 23
      - name: OpenAPI schema is committed
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql+psycopg://mix@localhost/mix
        run: |
          uv run python ../../scripts/export-openapi.py
          git diff --exit-code ../../docs/openapi.json

  docker-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.11.0"
      - uses: ./.github/actions/cache-pnpm-store
        with:
          lockfile: apps/web/pnpm-lock.yaml
      - name: Check frontend
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm format:check
          pnpm test:coverage
          pnpm build
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"
      - name: Generated API client is current
        working-directory: apps/web
        run: |
          pnpm generate:api
          git diff --exit-code src/generated/api.ts
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke (production build)
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          # `pnpm build` above produced dist/; preview serves that instead of
          # letting a dev-only transform mask a bundle problem.
          E2E_SERVER: preview
      - name: Third-party license notices are current
        run: |
          node scripts/generate-third-party-licenses.mjs
          # The generator writes both the root notice and the Desktop copy;
          # checking only one let the other silently go stale.
          git diff --exit-code THIRD_PARTY_LICENSES.md apps/desktop/THIRD_PARTY_LICENSES.md

  # Same reasoning as above for Memory: the spec is duplicated in both editions
  # and each edition keeps its own vocabulary constants. This fails when the
  # two specs diverge or when a spec no longer matches what is implemented.
  memory-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Memory spec parity check
        run: python3 scripts/check-memory-parity.py
      # Every literal HTTP error must have a stable code and English text;
      # otherwise an English UI silently shows Japanese.
      - name: Error code / translation parity check
        run: python3 scripts/check-error-i18n.py
      # The greeting is duplicated by hand in both editions (fragments, id-keyed
      # English maps, suggestion labels and prompts). Without this gate a
      # fragment or suggestion can lose its English entry and silently fall
      # back to Japanese.
      - name: Greeting parity check
        run: python3 scripts/check-greeting-parity.py
      # The browser action vocabulary is shared by the Rust Desktop backend and
      # the Python/Playwright Docker runner. This fails when an action exists in
      # the contract but one edition forgot to implement or explicitly mark it
      # unsupported.
      - name: Browser contract parity check
        run: python3 scripts/check-browser-parity.py
      # `run_events.kind` is another cross-edition contract, but the kinds are
      # string literals in both engines. The contract records the shared
      # vocabulary plus every deliberate one-edition kind, so adding an event
      # on one side forces a look at the other (and its UI parser).
      - name: Run event contract parity check
        run: python3 scripts/check-run-event-parity.py
      # The unofficial Codex integration is implemented independently in Rust
      # and Python. A drifted client id, base URL or quota threshold makes one
      # edition fail while the other still works.
      - name: ChatGPT / Codex contract parity check
        run: python3 scripts/check-chatgpt-parity.py
      # Skill packages are shared by both editions; a cap that differs makes
      # one edition import a bundle the other refuses (or silently truncates).
      - name: Skill package parity check
        run: python3 scripts/check-skill-parity.py
      # The execution/mcp images COPY the shared snapshot helper into /app;
      # this fails when a stage copies it from anywhere but the canonical
      # packages/tool_contracts path (a silent backup/restore fork).
      - name: Snapshot copy parity check
        run: python3 scripts/check-snapshot-parity.py

  # Cheap, dependency-free repository gates: no container, no network. These
  # used to rely on human discipline (README was translated by hand, nothing
  # looked for committed credentials).
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Committed credentials (including fixtures and docs)
        # The full repository scan is the script's default: a credential under
        # tests/ or docs/ is still a real credential. Intentional fixture values
        # are keyed on a value hash in the versioned allowlist, so reformatting
        # a fixture stays green while a different value in the same file fails.
        run: python3 scripts/check-secrets.py
      - name: README.md / README.en.md structure parity
        run: python3 scripts/check-readme-parity.py
      # The store compose is generated from the root compose. Drift used to be
      # caught only on release day; check it on every PR.
      - name: Generated store compose is current
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.2
          VERSION="$(awk '/^  version:/ {gsub(/["\047]/, "", $2); print $2; exit}' apps/MIX-agent/docker-compose.yml)"
          test -n "$VERSION"
          python scripts/render_zimaos_compose.py "v$VERSION"
          git diff --exit-code -- apps/MIX-agent/docker-compose.yml
      - name: Documentation links
        run: python3 scripts/check-doc-links.py

  # Dependency advisories are not a code-review problem; the weekly Dependabot
  # updates can lag a disclosure by days. This audits the locked server
  # requirements (what the image actually installs).
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('apps/server/uv.lock') }}
      - name: Install uv
        run: pip install uv==0.12.7
      - name: Export locked runtime requirements
        working-directory: apps/server
        # Exclude the project itself: pip-audit cannot install an editable
        # requirement when it is asked to verify hashes.
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: Audit
        # --strict fails the audit if any locked dependency cannot be
        # collected; without it pip-audit skips that dependency silently.
        run: uvx pip-audit==2.10.1 --strict --requirement "$RUNNER_TEMP/requirements.txt"
      # An SBOM turns "which versions were in v0.5.4?" into an artifact instead
      # of a rebuild. CycloneDX is the format Docker/Grype/Trivy ingest.
      - name: Generate Python SBOM (CycloneDX)
        run: uvx --from cyclonedx-bom==7.6.0 cyclonedx-py requirements "$RUNNER_TEMP/requirements.txt" --of JSON -o "$RUNNER_TEMP/sbom-python.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-python
          path: ${{ runner.temp }}/sbom-python.json
          if-no-files-found: error

  dependency-audit-rust:
    # Dependabot opens upgrade PRs, but it is not a gate: a disclosure can land
    # between weekly updates. Audit the lockfile the installers actually build.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop
          # `cargo install` otherwise recompiles cargo-audit (and its whole
          # dependency graph) on every run. Cache ~/.cargo/bin, keyed on the
          # pinned tool version so a bump invalidates it.
          cache-bin: true
          cache-bin-key: cargo-audit-0.22.2
      - name: Install cargo-audit
        # Pin the audit tool like `pip-audit==…` above: a new release must not
        # change CI's dependency graph or MSRV without a reviewed change.
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependencies
        working-directory: apps/desktop
        run: cargo audit

  desktop-fmt:
    # Lightweight single-OS fmt gate: rustfmt is platform-independent, so the
    # three-OS matrix below would only repeat the same check three times.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: cargo fmt check
        working-directory: apps/desktop
        run: cargo fmt --all -- --check

  desktop-rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libxdo-dev libgtk-3-dev libayatana-appindicator3-dev \
            fuse3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop
          # Cache the cargo-llvm-cov binary installed on the coverage leg;
          # otherwise the 0.9.1 toolchain is rebuilt from source every run.
          cache-bin: true
          cache-bin-key: cargo-llvm-cov-0.9.1
      # `cargo check` is intentionally omitted: `cargo clippy --all-targets`
      # type-checks the same targets and more (clippy ⊃ check), so a separate
      # check step would only recompile the workspace a second time.
      - name: cargo clippy
        working-directory: apps/desktop
        run: cargo clippy --workspace --all-targets -- -D warnings
      # NOTE: `cargo nextest` deliberately not adopted: heavier toolchain
      # install for marginal gain at this workspace size; revisit if test
      # time dominates CI.
      - name: cargo test
        working-directory: apps/desktop
        run: cargo test --workspace

      # Rust had no coverage floor: the three-OS matrix only proved that tests
      # pass, not which code they touch. Core and storage own the engine and
      # secret/DB paths, so they get an explicit gate. Install the tool only on
      # the coverage OS; the other two matrix legs run the same tests without
      # paying for instrumentation.
      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-22.04'
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Core/storage coverage gate
        if: matrix.os == 'ubuntu-22.04'
        working-directory: apps/desktop
        run: cargo llvm-cov -p mixd-core -p mixd-storage --summary-only --fail-under-lines 60

      # Spec §5's ranking gate, same thresholds and same shared fixture as the
      # `docker-backend` job — the fixture suite is the one suite whose numbers
      # are contractual across both editions, which is why the thresholds match
      # character for character. Ubuntu only: the synthetic-corpus numbers are
      # identical on every OS (the bench seeds its corpus), so the three-OS
      # matrix would buy nothing here, and `cargo test` above has already built
      # the bin, so this is incremental.
      #
      # `retrieval-bench` (hyphen) is the bin's name; `retrieval_bench.rs` is
      # its file. The edition's own naming.
      - name: Retrieval quality gate (spec §5)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: apps/desktop
        run: >
          cargo run -p mixd-core --bin retrieval-bench --
          --suite fixture --min-recall5 0.95 --min-recall8 0.95 --min-mrr 0.95 --max-noise 0.6

  desktop-ui:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libxdo-dev libgtk-3-dev libayatana-appindicator3-dev \
            fuse3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check version consistency
        run: node scripts/check-version-consistency.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.11.0"
      - uses: ./.github/actions/cache-pnpm-store
        with:
          lockfile: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop
      - name: Install UI dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"
      - name: UI lint + typecheck + test
        working-directory: apps/desktop/ui
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:coverage
      # The UI is built once by `tauri build` below (its `beforeBuildCommand`
      # runs `pnpm --filter mix-agent-desktop-ui build`), so the bundle budget
      # is checked after that step rather than compiling TypeScript twice.
      - name: Prettier check
        working-directory: apps/desktop/ui
        run: pnpm format:check


      # The bundling assets (icons, resource mapping) are only exercised by an
      # actual `tauri build`, and a missing icon or wrong resource key is
      # invisible to cargo check.
      - name: Bundle smoke test
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle
      - name: UI bundle budget
        run: node scripts/check-desktop-bundle.mjs

      # The bundle step proves it *links*; it does not prove the resulting
      # binary can open its data directory, read the database and pick a
      # secret backend. `--doctor` is exactly that check and exits before the
      # WebView starts, so it runs headless on CI.
      - name: Installed-binary doctor smoke test
        working-directory: apps/desktop
        env:
          MIX_DATA_DIR: ${{ runner.temp }}/mix-agent-smoke
          PYTHONOPTIMIZE: "0"
        run: |
          out="$(./target/release/mix-agent-desktop --doctor --json)"
          echo "$out"
          echo "$out" | python3 -c '
          import json, sys
          report = json.load(sys.stdin)
          if report.get("ok") is not True:
              raise SystemExit(f"doctor reported failure: {report}")
          if report.get("data_dir_writable") is not True:
              raise SystemExit(f"doctor data dir is not writable: {report}")
          if not report.get("version"):
              raise SystemExit(f"doctor did not report a version: {report}")
          print("doctor ok:", report["version"])
          '


  # Packaging is not covered by `tauri build --no-bundle` on Linux: NSIS/MSI
  # configuration, Windows resource paths and the WiX language settings only
  # fail on an actual Windows bundle.
  desktop-package-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.11.0"
      - uses: ./.github/actions/cache-pnpm-store
        with:
          lockfile: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop
          key: package-windows
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"
      # Tauri downloads NSIS/WiX from GitHub Releases during bundling; those
      # asset endpoints intermittently return 504 and throw away the compile.
      # Restore them from cache (and retry the first download) up front.
      - name: Prefetch Tauri Windows bundle tools
        uses: ./.github/actions/prefetch-tauri-windows-tools
      - name: Build Windows installers
        id: build
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Fork PRs receive empty secrets. `createUpdaterArtifacts: true`
          # (the tauri.conf.json default) then fails the build, so disable
          # updater artifacts for PR events; push/release builds stay signed.
          SIGNED: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            pnpm tauri build --bundles nsis,msi
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets unavailable for this event; building with createUpdaterArtifacts=false."
            pnpm tauri build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Verify installers were produced
        working-directory: apps/desktop
        shell: bash
        env:
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          set -euo pipefail
          nsis="$(find target/release/bundle/nsis -type f -name '*-setup.exe' -print -quit)"
          test -n "$nsis"
          msi="$(find target/release/bundle/msi -type f -name '*.msi' -print -quit)"
          test -n "$msi"
          # A signed build must also emit the updater signature next to the
          # NSIS installer (the payload latest.json advertises on Windows).
          # Without it, every client would reject the update.
          if [ "$SIGNED" = "true" ]; then
            test -s "${nsis}.sig"
            echo "Signed updater artifact present: ${nsis}.sig"
          else
            echo "Unsigned PR build: updater artifacts intentionally disabled."
          fi
      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mix-agent-desktop-windows-ci
          path: |
            apps/desktop/target/release/bundle/nsis/*.exe
            apps/desktop/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
