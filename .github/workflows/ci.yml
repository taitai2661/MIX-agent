name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run application test suite
        run: |
          docker compose --profile test run --build --rm test \
            sh -c "cd /app && export COVERAGE_FILE=/tmp/.coverage \
              && alembic upgrade head \
              && pytest -c /app/pyproject.toml -p no:cacheprovider -q \
                   --cov=mix_agent --cov-report=term-missing:skip-covered \
                   --cov-fail-under=70 /workspace/tests"

      # Spec §5's ranking is a *number*, so a weighting change can be caught as
      # "a specific score moved" rather than as "the order looked different".
      # The gate reads the shared recall fixture only — no database, no network,
      # no LLM — and is fully deterministic (exact scores to four decimals), so
      # the same thresholds are valid verbatim in the Desktop job below.
      #
      # Deliberately NOT gated here: latency. The fixture suite measures none,
      # and synthetic-corpus latency is machine-dependent; the bench still
      # reports it when run by hand with --suite synthetic.
      - name: Retrieval quality gate (spec §5)
        run: |
          docker compose --profile test run --build --rm test \
            sh -c "cd /app && python /workspace/experiments/run_retrieval_bench.py --suite fixture \
              --min-recall5 1.0 --min-recall8 1.0 --min-mrr 1.0 --max-noise 0.5"

  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.12.7
      - name: Ruff check
        working-directory: apps/server
        run: uv run ruff check
      - name: Ruff format check
        working-directory: apps/server
        run: uv run ruff format --check
      - name: Pyright (type check + warning budget)
        working-directory: apps/server
        run: uv run python ../../scripts/check-pyright-budget.py
      - name: OpenAPI schema is committed
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql+psycopg://mix:test-only-password@localhost/mix
        run: |
          uv run python ../../scripts/export-openapi.py
          git diff --exit-code ../../docs/openapi.json

  docker-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.11.0"
      - name: Check frontend
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm format:check
          pnpm test:coverage
          pnpm build
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"
      - name: Generated API client is current
        working-directory: apps/web
        run: |
          pnpm generate:api
          git diff --exit-code src/generated/api.ts
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke (production build)
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          # `pnpm build` above produced dist/; preview serves that instead of
          # letting a dev-only transform mask a bundle problem.
          E2E_SERVER: preview
      - name: Third-party license notices are current
        run: |
          node scripts/generate-third-party-licenses.mjs
          git diff --exit-code THIRD_PARTY_LICENSES.md

  # Same reasoning as above for Memory: the spec is duplicated in both editions
  # and each edition keeps its own vocabulary constants. This fails when the
  # two specs diverge or when a spec no longer matches what is implemented.
  memory-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Memory spec parity check
        run: python3 scripts/check-memory-parity.py
      # Every literal HTTP error must have a stable code and English text;
      # otherwise an English UI silently shows Japanese.
      - name: Error code / translation parity check
        run: python3 scripts/check-error-i18n.py
      # The greeting is duplicated by hand in both editions (fragments, id-keyed
      # English maps, suggestion labels and prompts). Without this gate a
      # fragment or suggestion can lose its English entry and silently fall
      # back to Japanese.
      - name: Greeting parity check
        run: python3 scripts/check-greeting-parity.py
      # The browser action vocabulary is shared by the Rust Desktop backend and
      # the Python/Playwright Docker runner. This fails when an action exists in
      # the contract but one edition forgot to implement or explicitly mark it
      # unsupported.
      - name: Browser contract parity check
        run: python3 scripts/check-browser-parity.py

  desktop-fmt:
    # Lightweight single-OS fmt gate: rustfmt is platform-independent, so the
    # three-OS matrix below would only repeat the same check three times.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: cargo fmt check
        working-directory: apps/desktop
        run: cargo fmt --all -- --check

  desktop-rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libxdo-dev libgtk-3-dev libayatana-appindicator3-dev \
            fuse3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop
      # `cargo check` is intentionally omitted: `cargo clippy --all-targets`
      # type-checks the same targets and more (clippy ⊃ check), so a separate
      # check step would only recompile the workspace a second time.
      - name: cargo clippy
        working-directory: apps/desktop
        run: cargo clippy --workspace --all-targets -- -D warnings
      # NOTE: `cargo nextest` deliberately not adopted: heavier toolchain
      # install for marginal gain at this workspace size; revisit if test
      # time dominates CI.
      - name: cargo test
        working-directory: apps/desktop
        run: cargo test --workspace

      # Spec §5's ranking gate, same thresholds and same shared fixture as the
      # `docker-backend` job — the fixture suite is the one suite whose numbers
      # are contractual across both editions, which is why the thresholds match
      # character for character. Ubuntu only: the synthetic-corpus numbers are
      # identical on every OS (the bench seeds its corpus), so the three-OS
      # matrix would buy nothing here, and `cargo test` above has already built
      # the bin, so this is incremental.
      #
      # `retrieval-bench` (hyphen) is the bin's name; `retrieval_bench.rs` is
      # its file. The edition's own naming.
      - name: Retrieval quality gate (spec §5)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: apps/desktop
        run: >
          cargo run -p mixd-core --bin retrieval-bench --
          --suite fixture --min-recall5 1.0 --min-recall8 1.0 --min-mrr 1.0 --max-noise 0.5

  desktop-ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libxdo-dev libgtk-3-dev libayatana-appindicator3-dev \
            fuse3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check version consistency
        run: node scripts/check-version-consistency.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.11.0"
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install UI dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"
      - name: UI lint + typecheck + test
        working-directory: apps/desktop/ui
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:coverage
      # `pnpm build` is `tsc -b && vite build`; the explicit `pnpm typecheck`
      # above already ran `tsc -b`, so build here via vite only to avoid
      # compiling TypeScript twice.
      - name: UI build
        working-directory: apps/desktop/ui
        run: pnpm exec vite build
      - name: Prettier check
        working-directory: apps/desktop/ui
        run: pnpm format:check


      # The bundling assets (icons, resource mapping) are only exercised by an
      # actual `tauri build`, and a missing icon or wrong resource key is
      # invisible to cargo check.
      - name: Bundle smoke test
        working-directory: apps/desktop
        run: pnpm tauri build --no-bundle

      - name: Chromium pin script is valid
        working-directory: apps/desktop
        run: node --check scripts/pin-chromium.mjs

  # Packaging is not covered by `tauri build --no-bundle` on Linux: NSIS/MSI
  # configuration, Windows resource paths and the WiX language settings only
  # fail on an actual Windows bundle. Chromium is no longer bundled, so this
  # job does not download a browser on every pull request.
  desktop-package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.11.0"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop
          key: package-windows
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
        env:
          COREPACK_ENABLE_AUTO_PIN: "0"
      - name: Build Windows installers
        working-directory: apps/desktop
        shell: bash
        run: pnpm tauri build --bundles nsis,msi
      - name: Verify installers were produced
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find target/release/bundle/nsis -type f -name '*-setup.exe' -print -quit)"
          test -n "$(find target/release/bundle/msi -type f -name '*.msi' -print -quit)"
      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mix-agent-desktop-windows-ci
          path: |
            apps/desktop/target/release/bundle/nsis/*.exe
            apps/desktop/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
