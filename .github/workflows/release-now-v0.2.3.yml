name: One-time MIX-agent v0.2.3 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-now-v0.2.3.yml"

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag
        env:
          RELEASE_TAG: v0.2.3
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi

  images:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [init, app, execution, browser-runner, browser-provisioner, mcp, mcp-runtime, egress]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/taitai2661/mix-agent-${{ matrix.target }}:v0.2.3
          labels: |
            org.opencontainers.image.source=https://github.com/taitai2661/MIX-agent
            org.opencontainers.image.version=v0.2.3

  zimaos-store:
    needs: images
    uses: ./.github/workflows/publish-store.yml
    with:
      tag: v0.2.3
    secrets: inherit
