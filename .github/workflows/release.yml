name: Release MIX-agent

# Docker images and ZimaOS store. Desktop releases (.dmg, installers) are
# built in parallel by `desktop-release.yml` for unified distribution on GitHub Releases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  preflight:
    name: Require green CI for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the CI conclusion for the tagged SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --limit 1 --json conclusion,status,url)"
          echo "$runs"
          conclusion="$(printf '%s' "$runs" | jq -r '.[0].conclusion // ""')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $GITHUB_SHA is '$conclusion'. Refusing to publish a release."
            exit 1
          fi

  images:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [init, app, execution, browser-runner, browser-provisioner, mcp, mcp-runtime, egress]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/taitai2661/mix-agent-${{ matrix.target }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/taitai2661/MIX-agent
            org.opencontainers.image.version=${{ github.ref_name }}

  zimaos-store:
    needs: images
    uses: ./.github/workflows/publish-store.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
