name: Release MIX-agent

# Docker images and ZimaOS store. Desktop releases (.dmg, installers) are
# built in parallel by `desktop-release.yml` for unified distribution on GitHub Releases.
#
# This workflow no longer creates the GitHub Release. `desktop-release.yml` is
# the sole creator (it owns the release notes body); the store publisher only
# uploads assets to the release that already exists.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  preflight:
    name: Require green CI for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job only reads workflow runs. Do not inherit the workflow-wide
    # contents/packages write scope (desktop-release.yml scopes per job too).
    permissions:
      actions: read
      contents: read
    steps:
      # ci.yml alone is not enough: `gh run list --commit` also matches PR runs
      # on feature branches. The shared gate requires a completed push-to-main
      # run for both ci.yml and validate-release.yml on this exact SHA.
      # The gate is a local composite action, so the checkout must precede it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/require-green-ci

  images:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [init, app, execution, browser-runner, browser-provisioner, mcp, mcp-runtime, egress]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/taitai2661/mix-agent-${{ matrix.target }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/taitai2661/MIX-agent
            org.opencontainers.image.version=${{ github.ref_name }}

  zimaos-store:
    needs: images
    uses: ./.github/workflows/publish-store.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
