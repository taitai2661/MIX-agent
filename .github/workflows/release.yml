name: Release MIX-agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [init, app, execution, browser-runner, browser-provisioner, mcp, mcp-runtime, egress]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/taitai2661/mix-agent-${{ matrix.target }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/taitai2661/MIX-agent
            org.opencontainers.image.version=${{ github.ref_name }}

  zimaos-store:
    needs: images
    uses: ./.github/workflows/publish-store.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
